<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">
    <title>Verivex</title>
</head>
<body>
    <h1>Verivex</h1>
    <p>Analyze a link before you open it.</p>

    <form action="/analyze" method="post">
        <input
         type="url"
         name="url"
         placeholder="Paste a URL..."
         required
         >
         <button type="submit">Analyze</button>
    </form>
</body>
</html>

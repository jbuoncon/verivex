<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verivex</title>
<style>
  :root {
    --paper: #eef1f4; --panel: #ffffff; --ink: #14213d; --muted: #5a6577; --line: #d3d9e0;
    --ok: #1b7f5c; --redirected: #a86a00; --broken: #c0392b; --restricted: #6b5b95; --blocked: #5a6577;
    --low: #1b7f5c; --caution: #a86a00; --high: #c0392b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 40px 20px 80px; }
  h1 { font-size: 2rem; margin: 0 0 4px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  textarea { width: 100%; min-height: 150px; padding: 12px; border: 1px solid var(--line);
             border-radius: 6px; font: 14px/1.5 ui-monospace, Menlo, Consolas, monospace;
             background: var(--panel); color: var(--ink); resize: vertical; }
  button { margin-top: 12px; padding: 10px 20px; border: 0; border-radius: 6px;
           background: var(--ink); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: progress; }
  :focus-visible { outline: 3px solid #3b82f6; outline-offset: 2px; }
  #msg { margin: 16px 0 0; color: var(--muted); min-height: 1.5em; }
  #note { margin: 12px 0 0; padding: 10px 12px; border-left: 4px solid var(--caution);
          background: var(--panel); font-size: .9rem; }
  #summary { display: flex; gap: 8px; flex-wrap: wrap; margin: 20px 0 12px; }
  #summary span { padding: 4px 10px; border-radius: 99px; background: var(--panel);
                  border: 1px solid var(--line); font-size: .9rem; }
  .table-wrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  th { font-size: .85rem; color: var(--muted); font-weight: 600; }
  td.url { font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; word-break: break-all; }
  td.detail { color: var(--muted); font-size: .9rem; }
  .badge { font-weight: 700; white-space: nowrap; }
  .flag { font-size: .85rem; color: var(--muted); margin-top: 4px; }
  .ok { color: var(--ok); } .redirected { color: var(--redirected); } .broken { color: var(--broken); }
  .restricted { color: var(--restricted); } .blocked { color: var(--blocked); }
  .low { color: var(--low); } .caution { color: var(--caution); } .high { color: var(--high); }
</style>
</head>
<body>
<main>
  <h1>Verivex</h1>
  <p class="sub">Paste links, one per line, to see whether they work and whether they look risky.</p>

  <label for="input" hidden>Links to check</label>
  <textarea id="input" placeholder="https://example.com&#10;http://192.168.0.1/update.exe"></textarea>
  <button id="run">Check links</button>
  <p id="msg" role="status"></p>
  <p id="note" hidden></p>

  <div id="summary"></div>
  <div class="table-wrap" id="results" hidden>
    <table>
      <thead><tr><th>Link status</th><th>Link</th><th>Safety</th><th>Details</th><th>Time</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>

<script>
  const STATE = { ok: "Working", redirected: "Redirects", broken: "Broken",
                  restricted: "Restricted", blocked: "Skipped" };
  const RISK = { low: "No red flags", caution: "Caution", high: "High risk" };
  const $ = (s) => document.querySelector(s);

  function cell(text, cls) {
    const td = document.createElement("td");
    td.className = cls;
    td.textContent = text;  // textContent, never innerHTML
    return td;
  }

  async function runCheck() {
    const btn = $("#run");
    if (btn.disabled) return;  // a check is already running
    const urls = $("#input").value.split(/\s+/).filter(Boolean);
    if (!urls.length) { $("#msg").textContent = "Paste at least one link."; return; }

    btn.disabled = true;
    $("#msg").textContent = `Checking ${urls.length} link${urls.length > 1 ? "s" : ""}...`;

    try {
      const res = await fetch("/api/check", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ urls }),
      });
      if (!res.ok) throw new Error("Server error " + res.status);
      render(await res.json());
      $("#msg").textContent = "";
    } catch (err) {
      $("#msg").textContent = "Could not reach the checker: " + err.message;
    } finally {
      btn.disabled = false;
    }
  }

  $("#run").addEventListener("click", runCheck);
  // Check automatically right after links are pasted (short delay lets the text box update first)
  $("#input").addEventListener("paste", () => setTimeout(runCheck, 100));

  function render({ results, reputation_checked }) {
    const note = $("#note");
    note.hidden = reputation_checked;
    note.textContent = "Malware and phishing database check is off. Set a Google Safe Browsing key to turn it on. Safety results below come from local red-flag checks only.";

    const rows = $("#rows");
    rows.replaceChildren();
    const counts = {}, stateCounts = {};

    for (const r of results) {
      counts[r.risk] = (counts[r.risk] || 0) + 1;
      stateCounts[r.state] = (stateCounts[r.state] || 0) + 1;
      const tr = document.createElement("tr");

      tr.appendChild(cell(STATE[r.state] + (r.status ? ` (${r.status})` : ""), "badge " + r.state));
      tr.appendChild(cell(r.final_url, "url"));

      const safety = document.createElement("td");
      const label = document.createElement("div");
      label.className = "badge " + r.risk;
      label.textContent = RISK[r.risk];
      safety.appendChild(label);
      for (const f of r.flags) {
        const d = document.createElement("div");
        d.className = "flag";
        d.textContent = f;
        safety.appendChild(d);
      }
      tr.appendChild(safety);

      tr.appendChild(cell(r.detail, "detail"));
      tr.appendChild(cell(r.ms + " ms", "detail"));
      rows.appendChild(tr);
    }

    const summary = $("#summary");
    summary.replaceChildren();
    for (const k of Object.keys(STATE)) {
      if (!stateCounts[k]) continue;
      const s = document.createElement("span");
      s.textContent = `${STATE[k]}: ${stateCounts[k]}`;
      summary.appendChild(s);
    }
    for (const k of ["high", "caution", "low"]) {
      if (!counts[k]) continue;
      const s = document.createElement("span");
      s.textContent = `${RISK[k]}: ${counts[k]}`;
      summary.appendChild(s);
    }
    $("#results").hidden = results.length === 0;
  }
</script>
</body>
</html>
